name: Weekly Audit

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ── Data Integrity ──
      - name: Validate all JSON files
        run: |
          for f in data/questions.json data/notes.json data/drugs.json data/flashcards.json data/topics.json data/tabs.json; do
            echo "Checking $f..."
            python3 -c "import json,sys; json.load(open('$f')); print('  OK')"
          done

      - name: Check question count and schema
        run: |
          python3 << 'PYEOF'
          import json, sys
          qs = json.load(open('data/questions.json'))
          errors = []
          if len(qs) < 940:
              errors.append(f'Question count too low: {len(qs)} (expected ≥940)')
          for i, q in enumerate(qs):
              if not q.get('q') or len(q['q']) < 15:
                  errors.append(f'Q{i}: question text missing or too short')
              if not isinstance(q.get('o'), list) or len(q.get('o', [])) < 4:
                  errors.append(f'Q{i}: needs >=4 options')
              if not isinstance(q.get('c'), int) or q['c'] < 0 or q['c'] >= len(q.get('o', [])):
                  errors.append(f'Q{i}: invalid correct answer index')
              if q.get('ti') is None or not isinstance(q.get('ti'), int) or q['ti'] < 0 or q['ti'] > 26:
                  errors.append(f'Q{i}: invalid topic index (must be 0..26 for Mishpacha)')
              if not q.get('t'):
                  errors.append(f'Q{i}: missing year field')
              if not q.get('e'):
                  errors.append(f'Q{i}: missing explanation')
          if errors:
              print(f'ERRORS ({len(errors)}):')
              for e in errors[:20]:
                  print(f'  {e}')
              if len(errors) > 20:
                  print(f'  ... and {len(errors)-20} more')
              sys.exit(1)
          print(f'OK: {len(qs)} questions, all valid')
          PYEOF

      - name: Check for conflicting duplicates
        run: |
          python3 << 'PYEOF'
          # Compare CHOSEN OPTION TEXT, not just index. Many "duplicate"
          # questions are the same Q with re-ordered options — different `c`
          # but same actual correct answer. Also respect c_accept (100% of
          # FM Qs carry it): if one Q's c is in the other's c_accept, the
          # chosen answers are cross-accepted, not conflicting.
          # Compare each new occurrence against ALL prior occurrences of the
          # same stem (not just the first) so a skipped pair doesn't shadow
          # a real conflict later in a triplet.
          import json, sys, re, unicodedata
          qs = json.load(open('data/questions.json'))

          def _norm_answer(s):
              # Normalize chosen-option text for "same answer, re-ordered options"
              # detection. Folds Unicode compatibility forms and strips ALL
              # whitespace + the hyphen/dash family (ASCII -, Unicode dashes,
              # Hebrew maqaf U+05BE). This is punctuation/whitespace-only — it
              # never collapses two semantically different answers — so it cannot
              # mask a genuine answer disagreement, but it does stop a one-hyphen
              # transcription variance (e.g. 'ל6-8' vs 'ל-6-8') from reddening CI
              # as a false "conflicting duplicate".
              s = unicodedata.normalize('NFKC', s)
              return re.sub(r'[\s־‐-―\-]', '', s)

          seen = {}  # key -> list of prior indices
          conflicts = []
          reorder_skipped = 0
          c_accept_skipped = 0
          excluded = 0
          # Soft-retired (dup) / out-of-pool (broken) rows are filtered from every
          # served quiz pool (app.js / modes.js / more-view.js) — users never see
          # them — so exclude them from this conflict gate too: comparing against
          # dead, often OCR-drifted retired copies reddens CI over data no one is
          # served. SERVED rows stay fully checked — a served/in-pool row that is
          # OCR-drifted still flags below.
          for i, q in enumerate(qs):
              if q.get('dup') or q.get('broken'):
                  excluded += 1
                  continue
              key = q['q'].strip()[:80]
              priors = seen.get(key, [])
              for j in priors:
                  qi, qj = qs[i], qs[j]
                  if qi['c'] == qj['c']:
                      continue
                  # Re-ordered duplicate: same chosen-option text at different indices.
                  # Compare punctuation/whitespace-normalized so a one-hyphen
                  # transcription variance isn't mistaken for a real conflict.
                  ti_text = qi['o'][qi['c']].strip() if qi['c'] < len(qi['o']) else None
                  tj_text = qj['o'][qj['c']].strip() if qj['c'] < len(qj['o']) else None
                  if ti_text and tj_text and _norm_answer(ti_text) == _norm_answer(tj_text):
                      reorder_skipped += 1
                      continue
                  # c_accept compatibility: chosen answers cross-accepted.
                  if qi['c'] in qj.get('c_accept', []) or qj['c'] in qi.get('c_accept', []):
                      c_accept_skipped += 1
                      continue
                  conflicts.append((j, i, key[:60]))
              seen.setdefault(key, []).append(i)
          print(f'scope: {len(qs) - excluded} served rows checked; {excluded} soft-retired (dup/broken) rows excluded')
          if conflicts:
              print(f'CRITICAL: {len(conflicts)} conflicting duplicates among SERVED rows:')
              for j, i, k in conflicts:
                  print(f'  Q{j} vs Q{i}: {k}...')
              sys.exit(1)
          msg = 'OK: No conflicting duplicates among served rows'
          extras = []
          if reorder_skipped: extras.append(f'{reorder_skipped} re-ordered pairs')
          if c_accept_skipped: extras.append(f'{c_accept_skipped} c_accept-compatible pairs')
          if extras:
              msg += f' ({", ".join(extras)} skipped)'
          print(msg)
          PYEOF

      - name: Check topic coverage (min 5 per topic)
        run: |
          python3 << 'PYEOF'
          import json, sys
          qs = json.load(open('data/questions.json'))
          counts = {}
          for q in qs:
              ti = q.get('ti', -1)
              counts[ti] = counts.get(ti, 0) + 1
          thin = [ti for ti in range(24) if counts.get(ti, 0) < 5]
          if thin:
              print(f'WARNING: {len(thin)} topics with <5 questions:')
              for ti in thin:
                  print(f'  ti={ti}: {counts.get(ti,0)} questions')
              sys.exit(1)
          print(f'OK: All 24 topics have >=5 questions')
          PYEOF

      # ── No Geriatrics Content ──
      - name: Check no geriatrics-only content
        run: |
          python3 << 'PYEOF'
          import sys, glob
          banned = ['GRS', "Hazzard's", 'CGA', 'Elder Abuse', 'Driving Fitness',
                    'BPSD', 'Dysphagia', 'FIM', 'eolState', 'renderEOLTree']
          found = []
          for f in sorted(glob.glob('src/**/*.js', recursive=True)):
              content = open(f).read()
              for term in banned:
                  if term in content:
                      found.append(f'{f}: "{term}"')
          if found:
              print(f'ERROR: Geriatrics-only content found:')
              for f in found: print(f'  {f}')
              sys.exit(1)
          print('OK: No geriatrics-only content')
          PYEOF

      # ── Version Sync ──
      - name: Check APP_VERSION matches SW cache
        run: |
          python3 << 'PYEOF'
          import re, sys
          constants = open('src/core/constants.js').read()
          sw = open('sw.js').read()
          m_app = re.search(r"APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]", constants)
          m_sw = re.search(r"CACHE\s*=\s*['\"]mishpacha-v([^'\"]+)['\"]", sw)
          if not m_app or not m_sw:
              print('ERROR: Version constants not found'); sys.exit(1)
          if m_app.group(1) != m_sw.group(1):
              print(f'MISMATCH: app={m_app.group(1)}, sw={m_sw.group(1)}'); sys.exit(1)
          print(f'OK: Versions match (v{m_app.group(1)})')
          PYEOF

      # ── Security ──
      - name: Check no eval() calls
        run: |
          python3 << 'PYEOF'
          import re, sys, glob
          for f in sorted(glob.glob('src/**/*.js', recursive=True)):
              content = open(f).read()
              evals = [m.start() for m in re.finditer(r'\beval\s*\(', content)]
              if evals:
                  print(f'WARNING: {len(evals)} eval() calls in {f}'); sys.exit(1)
          print('OK: No eval() calls')
          PYEOF

      - name: Audit innerHTML sanitization
        run: |
          python3 << 'PYEOF'
          import sys, glob
          warnings = []
          for f in sorted(glob.glob('src/**/*.js', recursive=True)):
              for i, line in enumerate(open(f).readlines(), 1):
                  if '.innerHTML=' in line or '.innerHTML =' in line:
                      after = line.split('innerHTML')[1]
                      if ('+' in after or '${' in after) and 'sanitize(' not in after:
                          warnings.append(f'  {f}:{i}: {line.strip()[:100]}')
          if warnings:
              print(f'WARNING: {len(warnings)} unsanitized innerHTML:')
              for w in warnings[:10]: print(w)
          else:
              print('OK: All dynamic innerHTML uses sanitize()')
          PYEOF

      # ── JS Syntax Check (all modules) ──
      - name: Check JS syntax
        run: |
          FAIL=0
          for f in src/core/*.js src/sr/*.js src/quiz/*.js src/ai/*.js src/features/*.js src/ui/*.js shared/*.js; do
            if ! node --check "$f" 2>/dev/null; then
              echo "SYNTAX ERROR: $f"
              node --check "$f" 2>&1 | head -3
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] && echo "OK: All modules pass syntax check" || exit 1

      # ── Tests + Build ──
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest tests
        run: npx vitest run
      - name: Verify production build
        run: npx vite build

      # ── Documentation Drift ──
      - name: Check CLAUDE.md version matches app
        run: |
          python3 << 'PYEOF'
          import re, sys
          constants = open('src/core/constants.js').read()
          m = re.search(r"APP_VERSION\s*=\s*['\"]([^'\"]+)['\"]", constants)
          if not m:
              print('ERROR: APP_VERSION not found'); sys.exit(1)
          ver = m.group(1)
          claude = open('CLAUDE.md').read()
          if f'v{ver}' not in claude and ver not in claude:
              print(f'WARNING: CLAUDE.md may be stale (app is v{ver})')
          else:
              print(f'OK: CLAUDE.md references v{ver}')
          PYEOF
